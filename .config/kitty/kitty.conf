# font_family JetBrainsMono Nerd Font
font_size 12

background_opacity 0.85
confirm_os_windows_close 0

enable_audio_bell no
cursor_trail 1

cursor_trail_decay 0.1 0.4
repaint_delay 5
input_delay 1

sync_to_monitor yes

windowrulev2 = opacity 0.86 0.86, class:^(kitty)$

# TAB BAR
tab_bar_edge		top
tab_bar_style		powerline
tab_powerline_style	slanted
tab_title_tempalte	"{index}: {title}"	

# Catpupuccin Mocha tab colors
active_tab_foreground	#11111b
active_tab_background	#cba67f
active_tab_font_style	bold
inactive_tab_foreground	#cdd6f4
inactive_tab_background	#313244
inactive_tab_font_style	normal
tab_bar_background	#11111b

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
#

foreground #CDD6F4
background #1E1E2E

selection_foreground #1E1E2E
selection_background #F5E0DC

cursor #F5E0DC
cursor_text_color #1E1E2E

color0 #45475A
color1 #F38BA8
color2 #A6E3A1
color3 #F9E2AF
color4 #89B4FA
color5 #F5C2E7
color6 #94E2D5
color7 #BAC2DE

color8 #585B70
color9 #F38BA8
color10 #A6E3A1
color11 #F9E2AF
color12 #89B4FA
color13 #F5C2E7
color14 #94E2D5
color15 #A6ADC8
