background {
    monitor =
    path = ~/Pictures/wallpapers/cosmic_arch.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.7
    contrast = 0.9
    vibrancy = 0.17
}

general {
    hide_cursor = true
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(cdd6f4ff)
    font_size = 112
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(11111baa)
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(a6adc8ff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 72
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = cmd[update:0] echo "Welcome back, $(whoami)"
    color = rgba(cba6f7ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    rounding = 16
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(1e1e2eee)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(89dcebff)
    fail_color = rgba(f38ba8ff)
    fail_text = <span foreground="##f38ba8">Wrong ($ATTEMPTS)</span>
    placeholder_text = <span foreground="##a6adc8">Enter Password</span>
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 2
}
